<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="notification-container"></div>

    <main class="web-container">
      <section class="hero-panel">
        <div class="logo-container">
          <img
            src="assets/logo-nextstop.png"
            alt="NextStop BGC Logo"
            class="brand-logo"
          />
        </div>
      </section>

      <section class="form-panel">
        <div class="content-box">
          <h1 class="main-title">Log in</h1>
          <p class="main-description text-bold">
            Don't have an account?
            <a href="sign_in.html" class="signup-link">Sign up</a>
          </p>

          <form class="login-form">
            <div class="input-group">
              <label for="email-username">EMAIL OR USERNAME</label>
              <input
                type="text"
                id="email-username"
                placeholder="Enter Email or Username"
                required
              />
            </div>

            <div class="input-group">
              <div class="label-row">
                <label for="password">PASSWORD</label>
                <a href="forgot_pass.html" class="forgot-link"
                  >Forgot password?</a
                >
              </div>
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
            </div>

            <button type="submit" class="btn btn-login form-submit-btn">
              Log in
            </button>
          </form>

          <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-text">Or log in with</span>
            <span class="divider-line"></span>
          </div>

          <div class="social-group">
            <a href="/api/auth/google" class="btn-social" id="btn-google">
              <svg
                class="social-icon"
                viewBox="0 0 24 24"
                fill="none"
                width="20"
                height="20"
              >
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                  fill="#FBBC05"
                />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                  fill="#EA4335"
                />
              </svg>
              <span>Google</span>
            </a>

            <a href="/api/auth/facebook" class="btn-social" id="btn-facebook">
              <svg
                class="social-icon"
                viewBox="0 0 24 24"
                fill="#1877F2"
                width="20"
                height="20"
              >
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>
              <span>Facebook</span>
            </a>
          </div>

          <a href="index.html" class="back-link">&longleftarrow; Back</a>
        </div>
      </section>
    </main>
  </body>
</html>
