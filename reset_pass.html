<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="web-container">
    <section class="hero-panel">
      <div class="logo-container">
        <img src="assets/logo-nextstop.png" alt="NextStop BGC Logo" class="brand-logo">
      </div>
    </section>

    <section class="form-panel">
      <div class="content-box">
        <h1 class="main-title">Set New Password</h1>
        <p class="main-description text-bold">
          Enter your new strong password below.
        </p>

        <form class="login-form">
          <div class="input-group">
            <label for="new-password">NEW PASSWORD</label>
            <input type="password" id="new-password" placeholder="Enter new password" required>
          </div>

          <button type="submit" class="btn btn-login form-submit-btn">Update Password</button>
        </form>

        <a href="log_in.html" class="back-link">&longleftarrow; Back to Login</a>
      </div>
    </section>
  </main>

</body>
</html>
