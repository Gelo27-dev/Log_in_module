<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/script.js" defer></script>
  </head>
  <body>
    <div id="notification-container"></div>

    <main class="web-container">
      <section class="hero-panel">
        <div class="logo-container">
          <img
            src="/assets/logo-nextstop.png"
            alt="NextStop BGC Logo"
            class="brand-logo"
          />
        </div>
      </section>

      <section class="form-panel">
        <div class="content-box">
          <h1 class="main-title">Create an account</h1>
          <p class="main-description text-bold">
            Already have one?
            <a href="log_in.html" class="signup-link">Log in</a>
          </p>

          <form class="login-form">
            <div
              class="password-strength-wrapper hidden-password-strength"
              aria-live="polite"
            >
              <div class="password-strength-bar">
                <span
                  id="password-strength-fill"
                  class="password-strength-fill"
                ></span>
              </div>
              <div class="password-strength-meta">
                <span class="password-strength-label">Password strength</span>
                <span
                  id="password-strength-text"
                  class="password-strength-text"
                >
                  Start typing
                </span>
              </div>
            </div>

            <div class="input-group">
              <label for="username">USER NAME</label>
              <input
                type="text"
                id="username"
                placeholder="Username"
                required
              />
            </div>

            <div class="input-group">
              <label for="email">EMAIL</label>
              <input type="email" id="email" placeholder="Email" required />
            </div>

            <div class="input-group">
              <label for="location">LOCATION</label>
              <input
                type="text"
                id="location"
                placeholder="e.g CALOOCAN CITY"
                required
              />
            </div>

            <div class="input-group">
              <label for="birthday">BIRTHDAY</label>
              <input type="date" id="birthday" required />
            </div>

            <div class="input-group">
              <label for="phone">PHONE NUMBER</label>
              <input
                type="tel"
                id="phone"
                placeholder="e.g +63 912 345 6789"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">PASSWORD</label>
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
            </div>

            <div class="input-group">
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirm Password"
                required
              />
            </div>

            <button type="submit" class="btn btn-login form-submit-btn">
              Create Account
            </button>
          </form>

          <a href="index.html" class="back-link">&longleftarrow; Back</a>
        </div>
      </section>
    </main>
  </body>
</html>
